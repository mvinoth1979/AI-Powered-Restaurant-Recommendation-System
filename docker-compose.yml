version: "3.9"

services:

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: zomato-ai-backend:latest
    container_name: zomato_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/locations"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s     # give dataset time to load (~50k rows)
    networks:
      - zomato_net

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Inject backend URL so the browser knows where to POST
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: zomato-ai-frontend:latest
    container_name: zomato_frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zomato_net

networks:
  zomato_net:
    driver: bridge
